cc-io-civil.workspace = true
cc-m3d-tools.workspace = true
cc-io-ifc.workspace = true
cc-bim.workspace = true
cc-io-takeoff.workspace = true
cc-takeoff.workspace = true
cc-part.workspace = true
cc-markup.workspace = true
cc-io-markup.workspace = true
cc-m3d.workspace = true
cc-drawing.workspace = true
cc-cad.workspace = true
cc-cad-geom.workspace = true
cc-engine.workspace = true
cc-geom.workspace = true
serde_json.workspace = true
cc-render.workspace = true
cc-io-dwg.workspace = true
cc-io-cad.workspace = true
cc-detail.workspace = true
cc-io-detail.workspace = true
egui = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[package]
name = "cc-ui-egui"
description = "CadCraft L6: the egui frontend (viewer canvas on wgpu, panels, theme)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.layer]
layer = 6

[lints]
workspace = true

[dependencies]
cc-drawing.workspace = true
cc-render.workspace = true
cc-io-dwg.workspace = true
egui = { version = "0.37", default-features = false }
egui-wgpu = { version = "0.37", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[package]
name = "cc-render"
description = "CadCraft L3: drawing to GPU buffers and draw calls (wgpu; no UI toolkit), plus the view transform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.layer]
layer = 3

[lints]
workspace = true

[dependencies]
cc-geom.workspace = true
cc-drawing.workspace = true
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu", "dx12", "metal", "vulkan", "gles", "std"] }
lyon_tessellation = "1"

[dev-dependencies]
pollster = "0.4"

[package]
name = "cc-live"
description = "CadCraft L3: Studio Live co-editing protocol (LIVE-PROTOCOL.md v1): MessagePack, envelopes, the session core, a headless client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.layer]
layer = 3

[lints]
workspace = true

[dependencies]
cc-cad.workspace = true
serde_json.workspace = true
# the handshake and frame encryption, as 0.5's crypto.rs and live-crypto.js (LIVE-CRYPTO.md; exact pins, THIRD_PARTY.md)
spake2 = { version = "=0.4.0", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "0.10"
# signed-in names (assertion.rs): Ed25519 verification on the curve crate spake2 already brings (same pin, no new features)
curve25519-dalek = { version = "=4.1.3", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
# snapshots over 64 KB travel deflated (zlib, as CompressionStream("deflate") in live-client.js)
miniz_oxide = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the LAN WebSocket's accept key (ws.rs) and the OS's randomness (keys, tokens, codes)
sha1 = { version = "=0.10.6", default-features = false }
getrandom = "0.3"
# mDNS (mdns.rs): SO_REUSEADDR / SO_REUSEPORT so the advertisement shares port 5353 with the OS's own responder
socket2 = { version = "=0.5.9", features = ["all"] }

[dev-dependencies]
rand_core = { version = "=0.6.4", default-features = false }

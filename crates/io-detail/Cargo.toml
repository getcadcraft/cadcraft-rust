[package]
name = "cc-io-detail"
description = "CadCraft L5: DetailCraft's files — IFC4 out (STEP by hand), DSTV NC1 and the NC zip, IFC import through cc-ifc, drawing sheets as DWG and DXF — at exact parity with the 0.5 JavaScript."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# Layer 5, not 4: the IFC import reads lines through cc-bim's IfcAPI line shapes (L4, the same `GetLine(mid, id, false)`
# view BimCraft uses), and drawing sheets go out through cc-io-dwg's writer (L3).
[package.metadata.layer]
layer = 5

[lints]
workspace = true

[dependencies]
cc-detail.workspace = true
cc-io-ifc.workspace = true
cc-io-dwg.workspace = true
cc-bim.workspace = true
cc-cad.workspace = true
cc-civil.workspace = true
cc-m3d.workspace = true
serde_json.workspace = true
libm = "0.2.16"

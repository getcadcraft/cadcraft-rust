[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["fuzz", "vendor"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/getcadcraft/cadcraft-rust"
authors = ["CadCraft <ddgconsultant@getcadcraft.com>"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
# The per-crate deny list (AGENTS.md section 4) sits at the top of each lib.rs/main.rs.
dbg_macro = "deny"
print_stderr = "allow"

[workspace.dependencies]
cc-geom = { path = "crates/geom" }
cc-drawing = { path = "crates/drawing" }
cc-cad = { path = "crates/cad" }
cc-cad-geom = { path = "crates/cad-geom" }
cc-gcons = { path = "crates/gcons" }
cc-m3d = { path = "crates/m3d" }
cc-m3d-tools = { path = "crates/m3d-tools" }
cc-io-dwg = { path = "crates/io-dwg" }
cc-io-skp = { path = "crates/io-skp" }
cc-io-ifc = { path = "crates/io-ifc" }
cc-io-m3d = { path = "crates/io-m3d" }
cc-m3d-files = { path = "crates/m3d-files" }
cc-io-cad = { path = "crates/io-cad" }
cc-render = { path = "crates/render" }
cc-tools = { path = "crates/tools" }
cc-engine = { path = "crates/engine" }
cc-ui-egui = { path = "crates/ui-egui" }
cc-mcp = { path = "crates/mcp" }
cc-live = { path = "crates/live" }
cc-manifold = { path = "crates/manifold" }
cc-takeoff = { path = "crates/takeoff" }
cc-io-takeoff = { path = "crates/io-takeoff" }
cc-markup = { path = "crates/markup" }
cc-io-markup = { path = "crates/io-markup" }
cc-bim = { path = "crates/bim" }
cc-civil = { path = "crates/civil" }
cc-io-civil = { path = "crates/io-civil" }
cc-proj = { path = "crates/proj" }
cc-detail = { path = "crates/detail" }
cc-io-detail = { path = "crates/io-detail" }
cc-part = { path = "crates/part" }
cc-clock = { path = "crates/clock" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
panic = "unwind"

[profile.release.package.cc-io-dwg]
overflow-checks = true

[profile.release.package.cc-io-skp]
overflow-checks = true

[profile.release.package.cc-io-ifc]
overflow-checks = true

[profile.release.package.cc-io-m3d]
overflow-checks = true

[profile.release.package.cc-io-takeoff]
overflow-checks = true

[profile.release.package.cc-takeoff]
overflow-checks = true

[profile.release.package.cc-io-markup]
overflow-checks = true

[profile.release.package.cc-io-civil]
overflow-checks = true

[profile.release.package.cc-civil]
overflow-checks = true

[profile.release.package.cc-part]
overflow-checks = true

[profile.bench]
inherits = "release"

[profile.profiling]
inherits = "release"
debug = true

# The web build: speed decides (AGENTS.md section 10): fat LTO, one codegen unit, opt-level 3.
[profile.web]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3

# hayro-syntax 0.8.0 with one panic removed (vendor/hayro-syntax/CADCRAFT-PATCH.md); drop when upstream has the fix
[patch.crates-io]
hayro-syntax = { path = "vendor/hayro-syntax" }

[package]
name = "cadcraft"
description = "CadCraft (Rust test version): cadcraft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.layer]
layer = 7

[lints]
workspace = true

[dependencies]
cc-ui-egui.workspace = true
cc-civil.workspace = true
cc-mcp.workspace = true
cc-detail.workspace = true
cc-recovery.workspace = true
cc-engine.workspace = true
cc-cad.workspace = true
cc-io-cad.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "x11", "wayland"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
egui = { version = "0.37", default-features = false }

# eframe on our own event loop to read each key's physical code (numpad.rs); the version already in the tree, exactly
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = { version = "=0.30.13", default-features = false }

[package]
name = "cadcraft-web"
description = "CadCraft (Rust test version): the web entry (WebGPU only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.layer]
layer = 7

[lints]
workspace = true

[dependencies]
cc-ui-egui.workspace = true
cc-io-dwg.workspace = true
web-time = "1"
egui = { version = "0.37", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl", "std"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Navigator", "Gpu", "console"] }
rfd = { version = "0.17", default-features = false }

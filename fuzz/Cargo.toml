[package]
name = "cadcraft-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cc-io-dwg = { path = "../crates/io-dwg" }
cc-cad = { path = "../crates/cad" }
cc-cad-geom = { path = "../crates/cad-geom" }
serde_json = "1"
cc-io-cad = { path = "../crates/io-cad" }
cc-io-skp = { path = "../crates/io-skp" }
cc-io-ifc = { path = "../crates/io-ifc" }
cc-manifold = { path = "../crates/manifold" }
cc-m3d = { path = "../crates/m3d" }
cc-m3d-tools = { path = "../crates/m3d-tools" }
cc-io-m3d = { path = "../crates/io-m3d" }
cc-takeoff = { path = "../crates/takeoff" }
cc-io-takeoff = { path = "../crates/io-takeoff" }

[[bin]]
name = "dwg_read"
path = "fuzz_targets/dwg_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dwg_roundtrip"
path = "fuzz_targets/dwg_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf_read"
path = "fuzz_targets/dxf_read.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
overflow-checks = true

[[bin]]
name = "cad_load"
path = "fuzz_targets/cad_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cad_dxf_read"
path = "fuzz_targets/cad_dxf_read.rs"
test = false
doc = false

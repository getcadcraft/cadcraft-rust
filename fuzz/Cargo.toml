[[bin]]
name = "skp_read"
path = "fuzz_targets/skp_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ifc_read"
path = "fuzz_targets/ifc_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifold_bool"
path = "fuzz_targets/manifold_bool.rs"
test = false
doc = false
bench = false

[[bin]]
name = "m3d_load"
path = "fuzz_targets/m3d_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "m3d_tools"
path = "fuzz_targets/m3d_tools.rs"
test = false

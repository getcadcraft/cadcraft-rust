[package]
name = "cadcraft-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cc-io-dwg = { path = "../crates/io-dwg" }
cc-cad = { path = "../crates/cad" }
cc-cad-geom = { path = "../crates/cad-geom" }
serde_json = "1"
cc-io-cad = { path = "../crates/io-cad" }
cc-io-skp = { path = "../crates/io-skp" }
cc-io-ifc = { path = "../crates/io-ifc" }
cc-manifold = { path = "../crates/manifold" }
cc-m3d = { path = "../crates/m3d" }
cc-m3d-tools = { path = "../crates/m3d-tools" }
cc-io-m3d = { path = "../crates/io-m3d" }
cc-takeoff = { path = "../crates/takeoff" }
cc-io-takeoff = { path = "../crates/io-takeoff" }
cc-markup = { path = "../crates/markup" }
cc-io-markup = { path = "../crates/io-markup" }
cc-bim = { path = "../crates/bim" }
cc-civil = { path = "../crates/civil" }
cc-io-civil = { path = "../crates/io-civil" }
cc-detail = { path = "../crates/detail" }
cc-io-detail = { path = "../crates/io-detail" }
cc-part = { path = "../crates/part" }
cc-mcp = { path = "../crates/mcp" }
cc-live = { path = "../crates/live" }

